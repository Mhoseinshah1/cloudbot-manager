server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;

    client_max_body_size 8m;

    # Docker's embedded DNS server. Combined with the variable in fastcgi_pass
    # below, this makes nginx re-resolve the app container's address instead of
    # caching the IP it saw at startup. Without it, recreating the app
    # container leaves nginx talking to an address that no longer exists and
    # every request returns 502 until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env above all) even if one reaches the web root.
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        # Assigning to a variable is what forces re-resolution; a literal
        # host in fastcgi_pass is resolved once at startup and cached forever.
        set $upstream_app app:9000;

        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
