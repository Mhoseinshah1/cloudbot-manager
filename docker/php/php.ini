; Production PHP settings for CloudBot Manager.

expose_php = Off

; Logs go to stderr so Docker captures and rotates them. Writing log files
; inside a container grows unbounded and is lost when the container is
; recreated.
log_errors = On
error_log = /dev/stderr
display_errors = Off
display_startup_errors = Off

memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 60
upload_max_filesize = 8M
post_max_size = 8M

date.timezone = UTC
